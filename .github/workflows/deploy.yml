name: SKY HOME FURNISHING Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Test & Validate Architecture
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword2026
          POSTGRES_DB: skyhome_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm --prefix packages/types run build

      - name: Generate Prisma Client
        run: npm --prefix apps/backend run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword2026@localhost:5432/skyhome_db_test

      - name: Run Backend Integration & Unit Tests
        run: npm --prefix apps/backend run test
        env:
          JWT_SECRET: test_secret_key_2026
          DATABASE_URL: postgresql://postgres:postgrespassword2026@localhost:5432/skyhome_db_test

      - name: Type Check & Build Backend
        run: npm --prefix apps/backend run build

      - name: Build Next.js Frontend
        run: npm --prefix apps/frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Images
        run: |
          docker build -t skyhome-backend:latest -f docker/Dockerfile.backend .
          docker build -t skyhome-frontend:latest -f docker/Dockerfile.frontend .

      - name: Run Docker Compose Health Smoke Test
        run: |
          cd docker
          docker compose up -d
          sleep 10
          curl -f http://localhost/api/health || exit 1
          docker compose down
